# Keeps readings.json (USCCB Mass readings) and office_audio.json (links to the Divine Office
# recordings) fresh when the app is hosted on GitHub Pages. Commits only on change.
# Runs in the morning and again in the evening, because Divine Office posts the next day's hours the evening before.
name: update-readings
on:
  schedule: [{ cron: '15 9 * * *' }, { cron: '40 1 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_readings.py
        continue-on-error: true
      - run: python3 tools/fetch_divineoffice.py
        continue-on-error: true
      - run: |
          git config user.name "ora-bot"; git config user.email "ora-bot@users.noreply.github.com"
          git add readings.json office_audio.json; git diff --cached --quiet || (git commit -m "Update readings and office audio" && git push)
