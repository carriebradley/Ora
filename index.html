<title>Ora — Daily Prayer</title>
<style>
:root{
  --bg:#f6f1e7; --card:#fffdf8; --ink:#2a2220; --muted:#655a54; --line:#e4dccd; --accent:#7a2a3d; --accent-ink:#fff; --gold:#b8922a; --lit:#3d7a4a; --lit-white:#f5f0e6; --rubric:#a8232a;

}
@media (prefers-color-scheme:dark){:root{--bg:#171214;--card:#221a1d;--ink:#efe6dc;--muted:#a99b92;--line:#352a2e;--accent:#d98a9c;--accent-ink:#1a1013;--gold:#d3b04c;--lit-white:#f0e8da;--rubric:#e0787a;--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 12px 8px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
header .date{flex:1;text-align:center;min-width:0}

#dp{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;left:50%;top:48px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.ib{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:1.25rem;color:var(--accent)}
.ib:active{background:var(--line)}
main{max-width:720px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 17px;margin:0 0 12px;box-shadow:var(--shadow)}
.lab{display:flex;align-items:center;gap:8px;font-size:.79rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lab .grow{flex:1}
.sw{width:12px;height:12px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.35);flex:none}
h2{font-family:var(--serif);font-weight:600;font-size:1.3rem;line-height:1.35;margin:8px 0 10px;overflow-wrap:break-word}
h3{font-family:var(--serif);margin:0 0 8px;font-size:1.1rem;line-height:1.35}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{font-size:.8rem;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--ink)}
.chip.major{background:var(--accent);color:var(--accent-ink)}
.chip.fast{background:#6a3f9a22;color:#6a3f9a}
@media (prefers-color-scheme:dark){.chip.fast{background:#a07bd422;color:#c4a6ee}}
p{margin:6px 0}

.fast{font-size:.9rem;color:#6a3f9a}
@media (prefers-color-scheme:dark){.fast{color:#c4a6ee}}
ul.also{margin:6px 0 0;padding:0;list-style:none;font-size:.91rem;line-height:1.5;color:var(--muted)}
ul.also li{padding:2px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;text-align:center;gap:6px;padding:9px 14px;border-radius:99px;border:1px solid var(--accent);color:var(--accent);font-size:.9rem;text-decoration:none;background:transparent}
.btn.fill{background:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn:active{opacity:.7}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.listen{color:var(--accent);font-size:.8rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line)}
.seg{display:flex;background:var(--line);border-radius:99px;padding:3px;gap:2px;margin:0 0 12px}
.seg button{flex:1;min-width:0;padding:9px 4px;border-radius:99px;font-size:.9rem;text-align:center}
.seg.hrs button{font-size:.8rem;padding:7px 1px;letter-spacing:-.01em;white-space:nowrap}
.seg button.on{background:var(--card);box-shadow:var(--shadow);font-weight:600}
.quote{font-family:var(--serif);font-size:calc(1.12rem * var(--reading-scale));line-height:1.6;margin:8px 0}
.quote small{display:block;font-family:var(--sans);font-size:.88rem;line-height:1.45;color:var(--muted);margin-top:6px}
.art img{width:100%;max-height:420px;object-fit:contain;background:#0001;border-radius:10px;display:block}
.art .ph[hidden]{display:none!important}.ph{height:160px;border-radius:10px;background:var(--line);display:grid;place-items:center;color:var(--muted);font-size:.85rem}
.cite{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:.95rem;line-height:1.5;overflow-wrap:anywhere}
.cite:first-of-type{border-top:0}.cite span:first-child{color:var(--muted)}
.step{border-left:3px solid var(--line);padding:2px 0 2px 12px;margin:0 0 14px}
.step.on{border-color:var(--accent)}
.step .t{font-family:var(--serif);font-weight:600}
.step .tx{font-family:var(--serif);font-size:calc(1.02rem * var(--reading-scale));line-height:1.65;white-space:pre-wrap}
.reading-day-title{font-family:var(--serif);font-weight:600;font-size:1.12rem;line-height:1.4;margin:0 0 12px}
.reading-main-title{display:flex;align-items:flex-start;gap:10px;font-family:var(--serif);font-size:1.35rem;line-height:1.35;font-weight:600;margin:12px 0 16px;color:var(--ink)}
.reading-main-title::before{content:"";width:5px;min-width:5px;height:1.15em;margin-top:.12em;border-radius:3px;background:var(--lit);opacity:.9}
.reading-heading{padding:12px 0 7px;border-top:1px solid var(--line);margin-top:10px}
.reading-heading:first-child{border-top:0;margin-top:0}
.reading-label{font-family:var(--serif);font-size:1.1rem;font-weight:600;line-height:1.35;color:var(--ink)}
.reading-reference{font-size:.86rem;line-height:1.45;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.reading-group .tx,.reading-group .asv{font-family:var(--serif);font-size:calc(1.02rem * var(--reading-scale));line-height:1.65}
.timer{font-variant-numeric:tabular-nums;font-size:1.6rem;font-family:var(--serif)}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.75rem;color:var(--muted);padding:4px 0;border-radius:10px}
nav button b{font-size:1.25rem;font-weight:400;line-height:1}
nav button.on{color:color-mix(in srgb,var(--lit) 60%,var(--ink));font-weight:600}
/* player */
#player{position:fixed;left:8px;right:8px;bottom:calc(68px + env(safe-area-inset-bottom));z-index:7;background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:8px 12px;display:none;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#player.show{display:flex}
#player .nm{flex:1;min-width:0;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player button{color:inherit;font-size:1.2rem;width:36px;height:36px;border-radius:50%;background:#fff2}
/* calendar */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{font-size:.74rem;text-align:center;color:var(--muted);padding:2px 0}
.cell{aspect-ratio:1/1.08;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:3px 2px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;font-size:.82rem;position:relative}
.cell.out{color:var(--muted)}.cell.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}.cell.sel{background:var(--line)}
.cell .dots{display:flex;gap:3px;min-height:10px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--c);border:1px solid rgba(0,0,0,.35)}
.dot.maj{box-shadow:0 0 0 2px var(--gold)}
.cell .f{position:absolute;top:1px;right:3px;font-size:.6rem;color:#6a3f9a}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.legend button{padding:5px 10px;border-radius:99px;border:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.legend button.on{border-color:var(--accent);color:var(--accent);font-weight:600}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--ink);max-width:460px;width:calc(100% - 28px);padding:16px}
dialog::backdrop{background:#0008}
label{display:block;font-size:.91rem;color:var(--muted);margin:10px 0 3px}
select,input[type=range]{width:100%;font:inherit;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.check{display:flex;align-items:center;gap:8px;margin:10px 0;color:var(--ink);font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
details>summary{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.skip-link{position:fixed;top:0;left:8px;z-index:20;background:var(--card);padding:10px;transform:translateY(-120%)}
.skip-link:focus{transform:translateY(0)}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.srcd{margin:8px 0 2px}.srcd>summary{font-size:.88rem;color:var(--muted)}.srcd p{font-size:.85rem;color:var(--muted);margin:6px 0}
details.credits>summary{list-style:none;display:flex;align-items:center}details.credits>summary::-webkit-details-marker{display:none}details.credits>summary::after{content:"Show";margin-left:auto;font-size:.8rem;color:var(--accent)}details.credits[open]>summary::after{content:"Hide"}
a{color:var(--accent)}
.asv{font-family:var(--serif);font-size:calc(1.02rem * var(--reading-scale));line-height:1.68;padding:2px 0 10px}.asv sup{font-size:.65em;color:var(--muted);margin-right:2px}
.sec{margin:14px 0;font-family:var(--serif);font-size:calc(1rem * var(--reading-scale));line-height:1.65}.sec>b{display:block;font-family:var(--sans,inherit);font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}.psalm{margin:6px 0 12px}.ant{margin:10px 0 2px;font-style:italic}.ant i{color:var(--muted)}
.note{background:var(--line);border-radius:10px;padding:10px 12px;font-size:.9rem;line-height:1.5;margin:8px 0}
.glance .gl{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:16px;row-gap:10px;align-items:center;padding:15px 0;border-top:1px solid var(--line);font-size:.9rem}
.glance .gl:first-of-type,.glance .lab+.gl{border-top:0}
.glance .lab{margin-bottom:5px}
.glance .gl[role="button"]{cursor:pointer;border-radius:10px;padding-left:10px;padding-right:10px;margin-left:-10px;margin-right:-10px;transition:background .15s}
.glance .gl.selected{background:color-mix(in srgb,var(--lit) 5%,transparent);box-shadow:inset 3px 0 0 var(--lit),inset -3px 0 0 var(--lit)}
.glance .gl[role="button"]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.glance .gn{color:var(--ink);font-weight:700;font-size:1.08rem;line-height:1.3;letter-spacing:.005em}
.glance .gb{justify-self:end;font-weight:700;padding:4px 11px;border-radius:99px;background:var(--line);white-space:nowrap;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16),0 0 0 1px color-mix(in srgb,var(--badge-color,var(--line)) 50%,var(--line))}
.glance .gb[style*="--lit-white"]{box-shadow:inset 0 0 0 1px #c8bba5,0 0 0 1px #d7cbb9}
.glance .gl.selected .gb{box-shadow:inset 0 0 0 1px rgba(0,0,0,.2),0 0 0 1.5px var(--badge-color,var(--line))}
/* Badges use each rite's liturgical colour; the label retains feast/fast status. */
.glance .gd{grid-column:1/-1;color:var(--ink);min-width:0;font-family:var(--serif);font-size:1rem;line-height:1.55;overflow-wrap:break-word}
@media (max-width:420px){.glance .gl{column-gap:10px}.glance .gb{font-size:.86rem}}

/* the liturgical colour of the day (set from the day's colour in the chosen tradition) */
html,body{background:var(--bg)}
body{background-image:linear-gradient(180deg,color-mix(in srgb,var(--lit) 9%,transparent) 0,transparent 260px);background-repeat:no-repeat}
header{background:color-mix(in srgb,var(--lit) 6%,var(--bg));border-bottom:0;padding-bottom:22px;position:sticky}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:13px;background:linear-gradient(180deg,color-mix(in srgb,var(--lit) 12%,var(--bg)),color-mix(in srgb,var(--lit) 30%,var(--bg)));border-bottom:2px solid var(--lit);pointer-events:none}
main>.card:first-child,main>section.card:first-of-type{border-top:3px solid var(--lit)}
h3{display:flex;align-items:center;gap:8px}
h3::before{content:"";width:4px;height:1em;border-radius:2px;background:var(--lit);opacity:.85;flex:none}
nav button.on b{color:inherit}
.sec b,.sec>div>b{color:var(--rubric)}
.sec>b{color:var(--muted)}
.cell.today{border-color:var(--lit);box-shadow:inset 0 0 0 1px var(--lit)}
.tab-heading{padding:6px 4px 16px}.tab-heading h1{font-family:var(--serif);font-size:1.5rem;line-height:1.2;margin:0 0 6px;font-weight:600}.tab-heading p{font-size:.9rem;line-height:1.45;color:var(--muted);margin:0}
/* Local liturgical reader */
#liturgical-reader{max-width:900px;max-height:92dvh;overflow:auto}
#liturgical-reader h2{font-family:var(--serif);font-size:1.2rem;margin:0 0 10px}
#liturgical-reader .reader-tools{position:sticky;top:-16px;background:var(--card);padding:10px 0;z-index:1}
#liturgical-reader input[type=number]{width:4.5em;min-height:40px;background:var(--bg);color:var(--ink);border:1px solid var(--line);font:inherit}
#liturgical-reader [hidden]{display:none!important}
#reader-page{width:100%;background:white;display:block}
#reader-text{white-space:pre-wrap;font-family:var(--serif);line-height:1.65;overflow-wrap:anywhere}
.reader-file{max-width:100%;font:inherit;color:var(--ink)}
.reader-status{overflow-wrap:anywhere}
#reader-chapters input,#reader-chapters select{width:100%;max-width:100%;min-height:44px;font:inherit;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:8px}
#reader-text pre{white-space:pre-wrap;overflow-wrap:anywhere}
#source-reader{width:min(960px,96vw);max-width:96vw;height:90dvh;max-height:90dvh;padding:12px;overflow:hidden}#source-reader[open]{display:flex;flex-direction:column;gap:10px}#source-reader .source-reader-head{display:flex;justify-content:space-between;align-items:center;gap:12px}#source-reader-frame{width:100%;flex:1;min-height:0;border:1px solid var(--line);border-radius:8px;background:white}#source-reader .row{flex-shrink:0}#source-reader-text{flex:1;min-height:0;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--serif);font-size:var(--reader-font,18px);line-height:1.7;padding:12px 8px}#source-reader [hidden]{display:none!important}#source-reader-frame[hidden]{display:none!important}#source-reader-text:not([hidden])+#source-reader-frame{display:none!important}#source-reader-controls{align-items:center;flex-wrap:wrap;gap:8px}#source-reader-controls .btn{padding:7px 12px}
.art-heading-icon{display:inline-flex;align-items:center;justify-content:center;flex:none;transform:translateY(-1px)}
.art-heading-icon svg{margin-right:8px}
.art .artwork-title::before{width:3px;height:.82em}
.card .lab:has(>svg),.card .lab:has(>.art-heading-icon){display:flex;align-items:center;gap:8px}
.card .lab:has(>svg) svg,.card .lab .art-heading-icon svg{margin:0}
.pope-card>.quote{margin-top:12px}
.glance>.liturgical-day-heading{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.glance>.liturgical-day-heading svg{margin:0}
.card:has(>.lab)>.art{margin-top:14px}
.art .artwork-title{margin:12px 0 7px;font-family:var(--serif);font-style:italic;font-weight:400;line-height:1.3}
.art .artwork-title::before{height:.82em;width:3px}
.pope-subsection{margin-top:16px;padding-top:14px;border-top:1px solid var(--line)}.pope-subheading{font-family:system-ui,sans-serif;font-size:.79rem;font-weight:650;letter-spacing:.04em;text-transform:uppercase;line-height:1.5}.pope-subheading .muted{font-weight:400;letter-spacing:0;text-transform:none}.pope-intention-title{font-family:var(--serif);font-size:1.07rem;font-weight:500;line-height:1.4;margin:9px 0 5px}.pope-intention-text{margin:0 0 9px;line-height:1.55}.pope-angelus-preview{font-family:var(--serif);font-size:1rem;line-height:1.55;margin:9px 0}.pope-angelus-details{margin:8px 0}.pope-angelus-details summary{cursor:pointer;font-size:.86rem}.pope-angelus-details ul{padding-left:1.3em;font-family:var(--serif);line-height:1.55}.pope-angelus-details li{margin:8px 0}.pope-source-link{display:inline-block;font-size:.82rem;margin-top:6px}

/* Prayer navigation: major tradition pills, minor hours as quiet underlined tabs. */
.prayer-major{margin-bottom:10px}
.prayer-major button{min-height:43px}
.prayer-minor,.seg.hrs.prayer-minor{background:transparent;border-radius:0;padding:0;gap:8px;margin:0 0 13px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.prayer-minor::-webkit-scrollbar{display:none}
.prayer-minor button,.seg.hrs.prayer-minor button{position:relative;flex:1 0 auto;min-width:0;border-radius:0;padding:10px 5px 12px;font-size:.86rem;font-weight:400;color:var(--muted);background:transparent;box-shadow:none;white-space:nowrap}
.prayer-minor button.on,.seg.hrs.prayer-minor button.on{background:transparent;box-shadow:none;color:var(--text);font-weight:600}
.prayer-minor button.on::after{content:"";position:absolute;bottom:0;left:18%;width:64%;height:2px;background:var(--lit);border-radius:2px}
.prayer-minor button:focus-visible,.prayer-major button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.prayer-note{font-size:.78rem;line-height:1.55;margin:4px 0 12px}
.step{margin-bottom:19px;padding-top:4px;padding-bottom:4px}

.card .lab{line-height:1.4}
.art .muted{line-height:1.5}

.justice-intro{display:flex;align-items:center;gap:13px;padding:15px 16px;margin-bottom:14px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(120deg,color-mix(in srgb,var(--gold) 10%,var(--card)),var(--card))}.justice-intro svg{width:30px;height:30px}.justice-intro strong{font-size:.78rem;letter-spacing:.08em}.justice-intro p{font-family:var(--serif);font-size:.95rem;line-height:1.45;color:var(--muted);margin:5px 0 0}.justice-ecology .lab{margin-bottom:12px}.justice-library>summary{padding:5px 0}.justice-library .seg{margin-top:15px!important}
.office-readings-text{font-size:1rem;line-height:1.6}.office-readings-text .asv,.office-readings-text .asv p{font-family:var(--serif);font-size:1.1rem!important;line-height:1.7!important}.office-readings-text .oortx-slot p{font-size:1.1rem!important;line-height:1.7!important}.office-readings-text details>summary{padding:5px 0}.office-readings-text .muted{line-height:1.55}
.justice-intro svg{color:var(--gold)}.justice-charity .lab,.justice-voice .lab,.justice-reading .lab,.justice-teaching .lab{margin-bottom:12px}

.divine-office-card{padding:17px 17px 22px}

/* One continuous Divine Office reader with a consistent first-control inset. */
.divine-office-card{padding:17px 17px 22px}
.divine-office-card>.prayer-major{margin-top:0!important}
.divine-office-card>.prayer-minor{margin-top:12px}
.divine-office-card .roman-office-player{margin:17px 0 19px}
.divine-office-card .step:last-child{margin-bottom:0}
@media(max-width:480px){.divine-office-card{padding:16px 15px 21px}.divine-office-card>.prayer-major{margin-top:0!important}}
.pope-reflection-heading{font-family:var(--sans);font-size:.82rem;letter-spacing:.065em;text-transform:uppercase;font-weight:650;color:var(--ink);margin:15px 0 10px}.pope-card .pope-reflection-heading+.quote{margin-top:0}
.justice-economic .lab,.justice-ecology .lab{margin-bottom:12px}
/* Shared section rhythm and responsive calendar/liturgy surfaces. */
