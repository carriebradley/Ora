name: Verify Ora
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-isolation=none tests/*.test.cjs
      - run: npm install --prefix /tmp/ora-tools playwright@1.56.1 axe-core@4.11.0
      - name: Select browser
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "ORA_CHROMIUM=$browser_path" >> "$GITHUB_ENV"
          else
            /tmp/ora-tools/node_modules/.bin/playwright install chromium
          fi
      - name: Mobile and desktop browser audit
        env:
          NODE_PATH: /tmp/ora-tools/node_modules
          ORA_ARTIFACT_DIR: /tmp/ora-browser-audit
        run: |
          python3 -m http.server 8765 >/tmp/ora-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/browser-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ora-browser-audit
          path: /tmp/ora-browser-audit
