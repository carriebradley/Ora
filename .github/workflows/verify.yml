name: Verify Ora
on: [push, pull_request]
permissions:
  contents: read
  checks: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-isolation=none tests/*.test.cjs
      - run: npm install --prefix /tmp/ora-tools playwright@1.56.1 axe-core@4.11.0
      - name: Select browser
        run: |
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "ORA_CHROMIUM=$browser_path" >> "$GITHUB_ENV"
          else
            /tmp/ora-tools/node_modules/.bin/playwright install chromium
          fi
      - name: Mobile and desktop browser audit
        shell: bash
        env:
          NODE_PATH: /tmp/ora-tools/node_modules
          ORA_ARTIFACT_DIR: /tmp/ora-browser-audit
        run: |
          set -o pipefail
          mkdir -p /tmp/ora-browser-audit
          python3 -m http.server 8765 >/tmp/ora-server.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/browser-audit.cjs 2>&1 | tee /tmp/ora-browser-audit/browser-log.txt
      - name: Record browser diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = '/tmp/ora-browser-audit/browser-log.txt';
            const text = fs.existsSync(path) ? fs.readFileSync(path, 'utf8').slice(-20000) : 'Browser step did not start.';
            await github.rest.checks.create({owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha, name: 'Browser diagnostics', status: 'completed', conclusion: 'neutral', output: {title: 'Ora browser audit output', summary: '```text\n' + text + '\n```'}});
            for (const family of ['roman-icel','byzantine-expanded','oor-expanded']) for (const theme of ['light', 'dark']) {
              const preview = '/tmp/ora-browser-audit/' + family + '-preview-' + theme + '.jpg';
              if (!fs.existsSync(preview)) continue;
              const image = fs.readFileSync(preview).toString('base64');
              if (image.length > 60000) continue;
              await github.rest.checks.create({owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha, name: 'Mobile prayer preview ' + family + ' ' + theme, status: 'completed', conclusion: 'neutral', output: {title: '390px ' + family + ' screenshot', summary: 'JPEG_BASE64:' + image}});
            }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ora-browser-audit
          path: /tmp/ora-browser-audit
