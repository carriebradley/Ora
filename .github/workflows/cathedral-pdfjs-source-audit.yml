name: Cathedral PDF.js source audit
on:
  push:
    branches:
      - 'ora-cathedral-pdfjs-source-audit-*'
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install PDF.js geometry polyfills for Node
        run: npm install --no-save --no-package-lock @napi-rs/canvas
      - name: Extract cathedral source with Ora PDF.js
        continue-on-error: true
        run: node tools/audit_ukrainian_cathedral_source.mjs
      - name: Prepare mobile browser for saved-book check
        run: |
          npm install --prefix /tmp/ora-cathedral-browser playwright@1.56.1
          browser_path=$(command -v google-chrome || command -v chromium || true)
          if [ -n "$browser_path" ]; then
            echo "ORA_CHROMIUM=$browser_path" >> "$GITHUB_ENV"
          else
            /tmp/ora-cathedral-browser/node_modules/.bin/playwright install chromium
          fi
      - name: Audit actual cathedral PDF inside Ora's 390px reader
        env:
          NODE_PATH: /tmp/ora-cathedral-browser/node_modules
        run: node tests/cathedral-live-source-browser.cjs
      - name: Record compact source-boundary diagnostics
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            let report={status:'error',note:'No source report was generated'};
            if(fs.existsSync('cathedral-pdfjs-audit.json')){
              try{report=JSON.parse(fs.readFileSync('cathedral-pdfjs-audit.json','utf8'));}catch(e){report.note='Invalid source report JSON';}
            }
            if(fs.existsSync('cathedral-browser-audit.json')){
              try{report.browser=JSON.parse(fs.readFileSync('cathedral-browser-audit.json','utf8'));}catch(e){report.browser={status:'error'};}
            }
            await github.rest.checks.create({
              owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,
              name:'Cathedral PDF.js extraction diagnostics',status:'completed',
              conclusion:report.status==='ok'&&report.browser?.status==='ok'?'success':'neutral',
              output:{title:'Read-only source headings and page boundaries',
                summary:JSON.stringify(report,null,2).slice(0,35000)}
            });
      - name: Save read-only source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cathedral-pdfjs-headings
          path: |
            cathedral-pdfjs-audit.json
            cathedral-browser-audit.json
