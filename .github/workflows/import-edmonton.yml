name: Import Edmonton calendar facts
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ora-calendar-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - run: python tools/import_edmonton_calendar.py --year 2026
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-isolation=none tests/*.test.cjs
      - name: Commit verified factual source update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add edmonton-2026.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh Edmonton calendar facts and citations'
            git push
          fi
