# Keeps readings.json fresh when the app is hosted on GitHub Pages. Runs daily; commits only on change.
name: update-readings
on:
  schedule: [{ cron: '15 9 * * *' }]
  workflow_dispatch:
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_readings.py
      - run: |
          git config user.name "ora-bot"; git config user.email "ora-bot@users.noreply.github.com"
          git add readings.json; git diff --cached --quiet || (git commit -m "Update readings" && git push)
