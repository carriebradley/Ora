name: update-readings
on:
  # GitHub Actions cron uses UTC. Run just after midnight Eastern in both DST
  # (04:05 UTC) and standard time (05:05 UTC), then refresh during the day.
  # The extra midnight-window run is intentional; imports merge by date.
  schedule:
    - cron: '5 4,5,10,14,18,22 * * *'
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: ora-daily-imports
  cancel-in-progress: false
# Unset by default. A repository Actions variable may opt into a citation-only
# public archive, independently of any permissions or review decision.
env:
  ORA_READINGS_PUBLICATION_MODE: ${{ vars.ORA_READINGS_PUBLICATION_MODE || 'full' }}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_readings.py
        continue-on-error: true
      # Fail closed for citation-only distribution even when the RSS request
      # failed and the old file is all that remains in this checkout.
      - name: Enforce optional citation-only public archive
        if: env.ORA_READINGS_PUBLICATION_MODE == 'references-only'
        run: |
          python3 publication_readings.py --input readings.json --output /tmp/ora-public-references.json
          mv /tmp/ora-public-references.json readings.json
      - run: python3 fetch_divineoffice.py
        continue-on-error: true
      - run: python3 fetch_angelus.py
        continue-on-error: true
      - run: |
          git config user.name "ora-bot"; git config user.email "ora-bot@users.noreply.github.com"
          git add readings.json office_audio.json angelus.json; git diff --cached --quiet || (git commit -m "Update readings, office audio and Angelus" && git push)
