name: update-readings
on:
  # GitHub Actions cron uses UTC. Run just after midnight Eastern in both DST
  # (04:05 UTC) and standard time (05:05 UTC), then refresh during the day.
  # The extra midnight-window run is intentional; imports merge by date.
  schedule:
    - cron: '5 4,5,10,14,18,22 * * *'
  workflow_dispatch:
permissions: { contents: write }
concurrency:
  group: ora-daily-imports
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch_readings.py
        continue-on-error: true
      - run: python3 fetch_divineoffice.py
        continue-on-error: true
      - run: python3 fetch_angelus.py
        continue-on-error: true
      - run: |
          git config user.name "ora-bot"; git config user.email "ora-bot@users.noreply.github.com"
          git add readings.json office_audio.json angelus.json; git diff --cached --quiet || (git commit -m "Update readings, office audio and Angelus" && git push)
