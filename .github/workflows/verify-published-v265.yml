name: Verify published Ora v265
on:
  push:
    branches: ['review/verify-published-v265']
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --prefix /tmp/ora-tools playwright@1.56.1
      - name: Verify the deployed prayer readers
        env:
          NODE_PATH: /tmp/ora-tools/node_modules
        run: |
          mkdir -p /tmp/ora-live-v265
          node <<'JS'
          const {chromium}=require('playwright');
          const {execFileSync}=require('node:child_process');
          (async()=>{
            const executablePath=execFileSync('bash',['-c','command -v google-chrome || command -v chromium'],{encoding:'utf8'}).trim();
            const browser=await chromium.launch({executablePath,headless:true,args:['--no-sandbox']});
            try {await require('./tests/published-smoke.cjs')(browser,'/tmp/ora-live-v265');}
            finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ora-live-v265
          path: /tmp/ora-live-v265
