name: Import Ukrainian daily liturgical hymns
on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 2'
  push:
    paths:
      - tools/import_edmonton_propers.py
      - .github/workflows/import-edmonton-propers.yml
permissions:
  contents: write
concurrency:
  group: ora-ukrainian-propers-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Test hymn extraction without network
        run: python -m unittest discover -s tests -p test_edmonton_propers.py
      - name: Fetch verified Edmonton dates
        run: python tools/import_edmonton_propers.py
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify project regression suite
        run: node --test --test-isolation=none tests/*.test.cjs
      - name: Commit date-specific Ukrainian hymns
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ukrainian-propers.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh dated Ukrainian Divine Liturgy propers'
            git push
          fi
