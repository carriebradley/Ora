name: Ora WebKit compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  checks: write
jobs:
  webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install matching Playwright JavaScript package
        run: npm install --prefix /tmp/ora-webkit playwright@1.56.1
      - name: Check WebKit smoke test syntax
        run: node --check tests/webkit-iphone-smoke.cjs
      - name: "iPhone-sized WebKit: navigation and private-book persistence"
        shell: bash
        env:
          NODE_PATH: /tmp/ora-webkit/node_modules
          ORA_WEBKIT_ARTIFACT_DIR: /tmp/ora-webkit-audit
        run: |
          set -o pipefail
          python3 -m http.server 8765 >/tmp/ora-webkit-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          mkdir -p /tmp/ora-webkit-audit
          node tests/webkit-iphone-smoke.cjs 2>&1 | tee /tmp/ora-webkit-audit/webkit-log.txt
      - name: Record WebKit diagnostics
        if: always()
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const f='/tmp/ora-webkit-audit/webkit-log.txt';
            const log=fs.existsSync(f)?fs.readFileSync(f,'utf8').slice(-14000):'No WebKit log created.';
            await github.rest.checks.create({
              owner:context.repo.owner,repo:context.repo.repo,head_sha:context.sha,
              name:'WebKit compatibility diagnostics',status:'completed',conclusion:'neutral',
              output:{title:'WebKit iPhone smoke test output',summary:'\`\`\`text\n'+log+'\n\`\`\`'}
            });
      - name: Preserve failure screenshot for diagnosis
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ora-webkit-failure
          path: /tmp/ora-webkit-audit
          if-no-files-found: ignore
