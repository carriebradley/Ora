name: Ora WebKit compatibility
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install WebKit browser and Linux dependencies
        run: |
          npm install --prefix /tmp/ora-webkit playwright@1.56.1
          /tmp/ora-webkit/node_modules/.bin/playwright install --with-deps webkit
      - name: Check WebKit smoke test syntax
        run: node --check tests/webkit-iphone-smoke.cjs
      - name: "iPhone-sized WebKit: navigation and private-book persistence"
        env:
          NODE_PATH: /tmp/ora-webkit/node_modules
          ORA_WEBKIT_ARTIFACT_DIR: /tmp/ora-webkit-audit
        run: |
          set -o pipefail
          python3 -m http.server 8765 >/tmp/ora-webkit-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          node tests/webkit-iphone-smoke.cjs
      - name: Preserve failure screenshot for diagnosis
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ora-webkit-failure
          path: /tmp/ora-webkit-audit
          if-no-files-found: ignore
